model: qwen2.5:14b-instruct
model_fast: qwen2.5:14b-instruct
model_big: gpt-oss:20b
prefer_fast: true
big_triggers:
  - deep
  - long
  - essay
  - synthesize
  - thorough
  - in depth
  - detailed
  - analysis
# Effective precedence: LOCAL_AGENT_OLLAMA_BASE_URL / OLLAMA_BASE_URL env,
# then this config value, then the built-in default below.
ollama_base_url: http://127.0.0.1:11434
max_tokens: 800
max_tokens_big_second: 1200
temperature: 0.2
timeout_s: 300
timeout_s_big_second: 600
max_chars_full_read: 200000
security:
  allowed_roots:
    - "runs/"
    - "allowed/"
  allowed_exts:
    - ".md"
    - ".txt"
    - ".json"
  deny_absolute_paths: true
  deny_hidden_paths: true
  allow_any_path: false
  auto_create_allowed_roots: true
  roots_must_be_within_security_root: true
workroot: "../local-agent-workroot/"
corpus:
  db_path: "index/index.sqlite"
  sources:
    - name: corpus
      root: "allowed/corpus/"
      kind: corpus
    - name: scratch
      root: "allowed/scratch/"
      kind: scratch
  max_chars: 1200
embeddings:
  db_path: "embeddings/db/embeddings.sqlite"
  provider: "torch"
  model_id: "sentence-transformers/all-MiniLM-L6-v2"
  preprocess: "obsidian_v1"
  chunk_preprocess_sig: ""
  query_preprocess_sig: ""
  batch_size: 64
  torch:
    local_model_path: ""
    cache_dir: ""
    device: "auto"
    dtype: "float16"
    batch_size: 64
    max_length: 512
    pooling: "mean"
    normalize: true
    trust_remote_code: false
    offline_only: true
retrieval:
  # NOTE: These defaults are tuned for higher recall and can be expensive:
  # - Larger `lexical_k` and `vector_k` increase the number of candidates
  #   to rank and fuse, raising CPU usage and query latency.
  # - Larger `vector_fetch_k` increases vector scoring work.
  # If you experience high latency or CPU load, consider lowering these, e.g.:
  #   lexical_k: 20
  #   vector_k: 20
  #   vector_fetch_k: 40
  # and only use higher values for explicit "high recall" runs or profiles.
  lexical_k: 20
  vector_k: 20
  vector_fetch_k: 40
  rel_path_prefix: ""
  # fusion: how lexical + vector hit-lists are merged.
  #   "simple_union" (default): average of normalized scores when both rank a chunk,
  #     otherwise the single available score. Stable, score-aware.
  #   "rrf": Reciprocal Rank Fusion. score = sum_r 1/(rrf_k + rank_r). Score-blind,
  #     robust to mismatched score distributions across rankers.
  fusion: "simple_union"
  rrf_k: 60
  # Phase 1 neighbor expansion (off by default to preserve current behavior).
  # neighbor_scope: adjacent_only | same_section | same_heading_path
  neighbor_expansion_enabled: false
  neighbor_scope: "adjacent_only"
  # Phase 2 refinement loop + rule-based query rewrite (both off by default
  # to preserve current behavior). When refinement is on, a coverage predicate
  # decides whether to run a second retrieval round with a rewritten query.
  refinement_round_enabled: false
  coverage_predicate:
    lexical_threshold: 0.5
    vector_threshold: 0.5
    memory_weight: 0.0
    top_n: 10
  rewrite:
    rule_based_enabled: false
    acronyms_path: "configs/acronyms.yaml"
grounding:
  # Increased from the default (8) to 15 to improve citation robustness.
  # This may increase prompt size, model latency, and cost. Operators can
  # tune this value and/or `runs.max_total_evidence_chars` below based on
  # their performance and cost requirements.
  evidence_top_n: 15
  citation_validation:
    enabled: true
    strict: false
    require_in_snapshot: true
    heading_match: "prefix"
    normalize_heading: true
runs:
  log_evidence_excerpts: true
  max_total_evidence_chars: 200000
  max_excerpt_chars: 1200
memory:
  db_path: "memory/durable.sqlite"
  enabled: true
# Phase 3 daemon + ephemeral session memory. Both default to OFF so the CLI
# behaves identically to Phase 2. When session.enabled is true and you invoke
# CLI commands with --session, daemon.enabled must also be true (or
# session.require_daemon_for_cli set to false for in-process mode).
daemon:
  enabled: true
  bind_host: "127.0.0.1"
  bind_port: 47921
  idle_timeout_s: 1800
  request_timeout_s: 5
session:
  enabled: true
  sessions_dir: "sessions"
  topic_summary_top_k: 8
  max_active_refs: 10
  max_bundle_ids: 5
  require_daemon_for_cli: true
  memory_rewrite_enabled: false
  coverage_memory_weight: 0.0
  promotion:
    enabled: false
    llm_suggest_enabled: false
